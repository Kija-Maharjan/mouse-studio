<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mousepad Studio — Custom Print Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dekko&family=Signika:wght@400;500;600&family=Beth+Ellen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bgGradient"></div>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Custom Print Preview</div>
      <h1>Mousepad Studio</h1>
    </div>
    <div class="sub">Upload artwork, check the fit across every size we cut, then send the proof to production.</div>
  </header>

  <div class="grid">
    <div class="panel">
      <div class="field">
        <label class="label">01 — Artwork</label>
        <div class="upload-area">
          <button class="upload-btn" id="uploadTrigger" type="button">⤒ Choose image</button>
          <div class="drag-drop" id="dropZone">
            <div class="drag-drop__icon">⤓</div>
            <div class="drag-drop__text">
              Drag & drop artwork here
              <span class="drag-drop__browse" id="browseLink">or browse</span>
            </div>
            <div class="drag-drop__hint">Supported: PNG, JPG, JPEG</div>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/*">
        <div class="filename" id="fileName">No file selected — showing blank stock.</div>
      </div>

      <div class="field">
        <label class="label">02 — Size</label>
        <div class="sizes" id="sizeList"></div>
      </div>

      <div class="field">
        <label class="label">03 — Export</label>
        <button class="btn btn-ghost" id="downloadBtn">Download proof (PNG)</button>
        <button class="btn btn-order" id="orderBtn">Place order</button>
        <div class="status" id="statusMsg"></div>
      </div>
    </div>

    <div class="panel stage-panel">
      <div class="stage-grid">
        <canvas class="stage active" data-size="s1" width="700" height="460"></canvas>
        <canvas class="stage" data-size="s2" width="700" height="460"></canvas>
        <canvas class="stage" data-size="s3" width="700" height="460"></canvas>
      </div>
      <div class="zoom-preview" id="zoomPreview" aria-hidden="true">
        <div class="zoom-label">Zoomed area</div>
        <canvas id="zoomCanvas" width="240" height="240"></canvas>
      </div>
      <div class="caption" id="caption"></div>
    </div>
  </div>

  <div class="review-modal" id="reviewModal" aria-hidden="true">
    <div class="review-backdrop" id="reviewBackdrop"></div>
    <div class="review-panel">
      <button class="review-close" id="reviewClose" aria-label="Close preview">×</button>
      <div class="review-title">Review artwork</div>
      <canvas id="reviewCanvas" width="1120" height="740"></canvas>
      <div class="review-actions">
        <button class="btn btn-ghost" id="reviewDownload">Download preview</button>
        <button class="btn btn-order" id="reviewCloseBtn">Close</button>
      </div>
    </div>
  </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
